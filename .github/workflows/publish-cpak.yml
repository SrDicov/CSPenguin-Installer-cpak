name: Publish cpak image

on:
  push:
    branches:
      - main
    paths:
      - Containerfile
      - cpak-launcher.sh
      - cspenguin.desktop
      - cspenguin-studio.desktop
      - install.sh
      - .github/workflows/publish-cpak.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: cpak-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/srdicov/cspenguin-installer-cpak:main
          provenance: mode=max
          sbom: true

      - name: Pin image digest
        env:
          IMAGE: ghcr.io/srdicov/cspenguin-installer-cpak:main
        run: |
          digest='${{ steps.build.outputs.digest }}'
          jq --arg image "${IMAGE%:main}@${digest}" '.image = $image' cpak.json > cpak.json.tmp
          mv cpak.json.tmp cpak.json

      - name: Install cpak validator
        env:
          CPAK_VERSION: v2.13.3
        run: |
          mkdir -p "$RUNNER_TEMP/cpak"
          cd "$RUNNER_TEMP/cpak"
          curl -fsSLO "https://github.com/Containerpak/cpak/releases/download/${CPAK_VERSION}/cpak-linux-amd64"
          curl -fsSLO "https://github.com/Containerpak/cpak/releases/download/${CPAK_VERSION}/SHA256SUMS"
          grep 'cpak-linux-amd64$' SHA256SUMS | sha256sum -c -
          mv cpak-linux-amd64 cpak
          chmod 0755 cpak
          echo "$RUNNER_TEMP/cpak" >> "$GITHUB_PATH"

      - name: Validate and lock package
        run: |
          cpak validate cpak.json
          cpak lock --origin github.com/srdicov/cspenguin-installer-cpak cpak.json

      - name: Commit manifest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cpak.json cpak.lock.json
          git diff --cached --quiet || git commit -m "chore: pin cpak image digest"
          git push
